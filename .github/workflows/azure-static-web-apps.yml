name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# One run at a time per pull request (and one at a time for main), in the order
# the events arrived. Without this, merging a PR while its deploy was still
# uploading let "Close preview environment" finish first; the deploy then
# created the preview after it had been "closed", and nothing ever removed it.
# Three of those filled the Free plan's preview slots (see site-history,
# 2026-11-14). cancel-in-progress stays false: a cancelled runner does not stop
# an upload Azure has already accepted, so the close must wait for the deploy.
concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9  # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          skip_app_build: true
          # Dependabot runs get no secrets, so there is no token to deploy
          # with. Skip the upload for them (the build above is still the check)
          # instead of failing. Anyone else with a missing token still fails,
          # so a lost secret can't silently skip a production deploy.
          skip_deploy_on_missing_secrets: ${{ github.actor == 'dependabot[bot]' }}

  close_pull_request:
    # Dependabot's own runs have no token and its PRs never get a preview.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close preview
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9  # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
