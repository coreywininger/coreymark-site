version: 2

# Every open PR against main gets an Azure Static Web Apps staging
# environment, and the app has a small fixed number of those. Dependabot is
# therefore kept to a few open PRs: one grouped PR per ecosystem per week.
# (Security updates are raised separately and are not part of the groups.)
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      npm:
        patterns:
          - "*"
