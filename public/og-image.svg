<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1200" height="630" fill="#12151C"/>
  <g transform="translate(110, 0)">
    <text id="name" y="280" fill="#F0F2F5" font-size="96" font-weight="700" letter-spacing="-1.5">Corey Wininger</text>
    <!-- x is computed at build time by scripts/build-og-image.mjs so the bar stays centered under the full name -->
    <rect id="accent-bar" y="308" width="160" height="4" fill="#2DD4BF"/>
    <g fill="#9CA3AF" font-size="36" font-weight="400">
      <text x="0" y="380">Writing about IT operations, translating tech to the</text>
      <text x="0" y="432">business, AI for the people who actually run it, hybrid</text>
      <text x="0" y="484">cloud economics — and sometimes a weekend project.</text>
    </g>
  </g>
</svg>
